name: todolist

services:
  todo-db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks: [todo-net]

  back-js:
    build: ./back-js
    image: todo-back-js
    environment:
      PGHOST: todo-db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    depends_on:
      todo-db:
        condition: service_healthy
    networks: [todo-net]

  front-js:
    build: ./front-js
    image: todo-front-js
    ports: ["8080:80"]
    depends_on: [back-js]
    networks: [todo-net]

  front-ts:
    build: ./front-ts
    image: todo-front-ts
    ports: ["8081:80"]
    depends_on: [back-js]
    networks: [todo-net]

networks:
  todo-net:
    driver: bridge

volumes:
  db-data:
