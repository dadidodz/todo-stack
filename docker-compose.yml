name: todolist

services:
  todo-db:
    image: postgres:18
    # Values come from .env (read by compose); :? aborts if one is missing
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?set it in .env (see .env.example)}
    volumes:
      # Postgres 18 keeps its data under /var/lib/postgresql/18/docker (not .../data as in <= 17)
      - db-data:/var/lib/postgresql
      # Run once, only when db-data is empty
      - ./back-js/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h localhost: only the real server listens on TCP, not the temporary init one
      # $$: expanded by the container's shell, not by compose
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks: [todo-net]
    # No ports: only reachable from todo-net (debug with: docker compose exec todo-db psql -U todo)

  back-js:
    build: ./back-js
    image: todo-back-js
    volumes:
      # Config is not in the image; it has no db settings, so pg falls back to the PG* vars below
      - ./back-js/config.docker.json:/app/config.json:ro
    environment:
      PGHOST: todo-db  # the service name above
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    depends_on:
      todo-db:
        condition: service_healthy
    networks: [todo-net]
    # No ports: only reachable through the fronts' /api proxy

  front-js:
    build: ./front-js
    image: todo-front-js
    # BACKEND_URL defaults to http://back-js:3000 in the image
    ports: ["8080:80"]
    depends_on: [back-js]
    networks: [todo-net]

  front-ts:
    build: ./front-ts
    image: todo-front-ts
    ports: ["8081:80"]
    depends_on: [back-js]
    networks: [todo-net]

networks:
  # User-defined bridge: built-in DNS, so services reach each other by service name
  todo-net:
    driver: bridge

volumes:
  db-data:
