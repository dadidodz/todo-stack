name: back-js

on:
  push:
    branches: [main]
    paths: [back-js/**, .github/workflows/back-js.yml, .github/workflows/_image.yml]
  pull_request:
    paths: [back-js/**, .github/workflows/back-js.yml, .github/workflows/_image.yml]
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Throwaway Postgres matching back-js/config.json (localhost:5432, todo/todo)
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo
        ports: ["5432:5432"]
        # -h localhost: only the real server listens on TCP, not the temporary init one
        options: >-
          --health-cmd "pg_isready -h localhost -U todo -d todo"
          --health-interval 2s --health-timeout 3s --health-retries 15
    defaults:
      run:
        working-directory: back-js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable pnpm && pnpm install --frozen-lockfile
      # Service containers start before checkout, so init.sql can't be mounted: apply it with psql
      - run: psql -h localhost -U todo -d todo -f db/init.sql
        env:
          PGPASSWORD: todo
      - run: pnpm test

  image:
    needs: test
    uses: ./.github/workflows/_image.yml
    with:
      service: back-js
    permissions:
      contents: read
      packages: write
