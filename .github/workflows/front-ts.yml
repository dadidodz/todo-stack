name: front-ts

on:
  push:
    branches: [main]
    paths: [front-ts/**, .github/workflows/front-ts.yml, .github/workflows/_image.yml]
  pull_request:
    paths: [front-ts/**, .github/workflows/front-ts.yml, .github/workflows/_image.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/_image.yml
    with:
      service: front-ts
    permissions:
      contents: read
      packages: write
