name: front-ts

on:
  push:
    branches: [main]
    paths: [front-ts/**, .github/workflows/front-ts.yml, .github/workflows/_image.yml]
  pull_request:
    paths: [front-ts/**, .github/workflows/front-ts.yml, .github/workflows/_image.yml]
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read

jobs:
  # Type errors fail `pnpm build` (tsc) inside the Dockerfile, so the image build is the type check
  image:
    uses: ./.github/workflows/_image.yml
    with:
      service: front-ts
    permissions:
      contents: read
      packages: write
