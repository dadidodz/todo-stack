<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo (TS)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 30rem; margin: 2rem auto; padding: 0 1rem; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; padding: .25rem 0; }
    li:has(input:checked) span { text-decoration: line-through; opacity: .6; }
    #error { color: crimson; }
  </style>
</head>
<body>
  <h1>Todo (TS)</h1>
  <form id="form">
    <input id="title" placeholder="What to do?" aria-label="New todo" required>
    <button>Add</button>
  </form>
  <p id="error" role="alert"></p>
  <ul id="list"></ul>
  <!-- app.js is generated from src/app.ts by `pnpm build` -->
  <script type="module" src="app.js"></script>
</body>
</html>
